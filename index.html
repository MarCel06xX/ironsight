<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Ironsight</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <select id="adapter" data-i18n-title="adapter.label"></select>
        <input
          id="targets"
          type="text"
          spellcheck="false"
          autocomplete="off"
          maxlength="4096"
          data-i18n-placeholder="scan.targetPlaceholder"
        />
        <button id="scan-btn" type="button"></button>
        <div class="progress">
          <progress id="progress" value="0" max="1"></progress>
          <span id="progress-text"></span>
        </div>
      </header>
      <p id="error" class="error" role="alert" hidden></p>
      <main class="results">
        <table>
          <thead>
            <tr>
              <th data-i18n="col.ip"></th>
              <th data-i18n="col.mac"></th>
              <th data-i18n="col.rtt"></th>
              <th data-i18n="col.seenBy"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </main>
    </div>
  </body>
</html>
