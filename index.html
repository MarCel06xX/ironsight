<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Ironsight</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <select id="adapter" data-i18n-title="adapter.label" data-i18n-aria-label="adapter.label"></select>
        <input
          id="targets"
          type="text"
          spellcheck="false"
          autocomplete="off"
          maxlength="4096"
          data-i18n-placeholder="scan.targetPlaceholder"
          data-i18n-aria-label="scan.targetLabel"
        />
        <button id="scan-btn" type="button" class="primary"></button>
        <div class="progress">
          <progress id="progress" value="0" max="1"></progress>
          <span id="progress-text" aria-live="polite"></span>
        </div>
        <button
          id="settings-btn"
          type="button"
          class="icon-button"
          data-i18n-title="settings.open"
          data-i18n-aria-label="settings.open"
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <circle cx="12" cy="12" r="6.5" />
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" />
          </svg>
        </button>
      </header>
      <p id="error" class="error" role="alert" hidden></p>
      <div class="toolbar">
        <input
          id="filter"
          type="search"
          spellcheck="false"
          autocomplete="off"
          maxlength="200"
          data-i18n-placeholder="filter.placeholder"
          data-i18n-aria-label="filter.label"
        />
        <div class="status-filter" role="group" data-i18n-aria-label="filter.show">
          <span class="muted" data-i18n="filter.show"></span>
          <label class="checkbox">
            <input id="show-online" type="checkbox" />
            <span data-i18n="status.online"></span>
          </label>
          <label class="checkbox">
            <input id="show-offline" type="checkbox" />
            <span data-i18n="status.offline"></span>
          </label>
          <label class="checkbox">
            <input id="show-unused" type="checkbox" />
            <span data-i18n="status.unused"></span>
          </label>
        </div>
        <span id="shown-count" class="muted"></span>
        <button id="import-btn" type="button" data-i18n="import.open"></button>
        <button id="export-btn" type="button" data-i18n="export.open" disabled></button>
      </div>
      <div class="workspace">
        <div id="table" tabindex="0" data-i18n-aria-label="table.label"></div>
        <aside id="details" class="details"></aside>
      </div>
    </div>

    <div id="context-menu" class="menu" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>

    <dialog id="export-dialog" aria-labelledby="export-title">
      <form id="export-form" method="dialog" novalidate>
        <h2 id="export-title" data-i18n="export.title"></h2>
        <fieldset class="field">
          <legend data-i18n="export.format"></legend>
          <label class="radio">
            <input type="radio" name="export-format" value="csv" checked />
            <span data-i18n="export.formatCsv"></span>
          </label>
          <label class="radio">
            <input type="radio" name="export-format" value="json" />
            <span data-i18n="export.formatJson"></span>
          </label>
          <label class="radio">
            <input type="radio" name="export-format" value="html" />
            <span data-i18n="export.formatHtml"></span>
          </label>
        </fieldset>
        <label id="export-delimiter-field" class="field">
          <span data-i18n="export.delimiter"></span>
          <select id="export-delimiter"></select>
        </label>
        <fieldset class="field">
          <legend data-i18n="export.scope"></legend>
          <label class="radio">
            <input type="radio" name="export-scope" value="all" checked />
            <span id="export-scope-all"></span>
          </label>
          <label class="radio">
            <input type="radio" name="export-scope" value="view" />
            <span id="export-scope-view"></span>
          </label>
        </fieldset>
        <div class="dialog-actions">
          <button id="export-cancel" type="button" data-i18n="export.cancel"></button>
          <button type="submit" class="primary" data-i18n="export.submit"></button>
        </div>
      </form>
    </dialog>

    <dialog id="update-dialog" aria-labelledby="update-title">
      <h2 id="update-title" data-i18n="update.title"></h2>
      <p id="update-text"></p>
      <div id="update-notes-block">
        <h3 data-i18n="update.notes"></h3>
        <div id="update-notes" class="update-notes"></div>
      </div>
      <p id="update-hint" class="note" hidden></p>
      <div id="update-progress-block" class="update-progress" hidden>
        <progress id="update-progress"></progress>
        <span id="update-progress-text" class="muted"></span>
      </div>
      <p id="update-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="update-skip" type="button" data-i18n="update.skip"></button>
        <button id="update-later" type="button" data-i18n="update.later"></button>
        <button id="update-install" type="button" class="primary"></button>
      </div>
    </dialog>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form" method="dialog" novalidate>
        <h2 id="settings-title" data-i18n="settings.title"></h2>
        <label class="field">
          <span data-i18n="settings.theme"></span>
          <select id="set-theme"></select>
        </label>
        <label class="field">
          <span data-i18n="settings.language"></span>
          <select id="set-language"></select>
        </label>
        <label class="field">
          <span data-i18n="settings.concurrency"></span>
          <input id="set-concurrency" type="number" min="1" max="256" step="1" required />
          <small data-i18n="settings.concurrencyHint"></small>
        </label>
        <label class="field">
          <span data-i18n="settings.timeout"></span>
          <input id="set-timeout" type="number" min="100" max="10000" step="1" required />
          <small data-i18n="settings.timeoutHint"></small>
        </label>
        <fieldset class="field">
          <legend data-i18n="settings.offlineDevices"></legend>
          <label class="field">
            <span data-i18n="settings.offlineNames"></span>
            <select id="set-offline-names"></select>
          </label>
          <label class="checkbox">
            <input id="set-remember" type="checkbox" />
            <span data-i18n="settings.rememberDevices"></span>
          </label>
          <small class="muted block" data-i18n="settings.rememberHint"></small>
          <div class="update-row">
            <button id="set-forget" type="button" data-i18n="settings.forgetDevices"></button>
          </div>
        </fieldset>
        <fieldset class="field">
          <legend data-i18n="settings.portScan"></legend>
          <label class="checkbox">
            <input id="set-port-scan" type="checkbox" />
            <span data-i18n="settings.portScanEnable"></span>
          </label>
          <small class="muted block" data-i18n="settings.portNotice"></small>
          <label class="field">
            <span data-i18n="settings.portPreset"></span>
            <select id="set-port-preset"></select>
          </label>
          <div id="set-port-custom-field" class="field" hidden>
            <label for="set-port-custom" data-i18n="settings.portCustom"></label>
            <input
              id="set-port-custom"
              type="text"
              spellcheck="false"
              autocomplete="off"
              maxlength="2048"
              aria-describedby="set-port-custom-msg"
              data-i18n-placeholder="settings.portCustomPlaceholder"
            />
            <small id="set-port-custom-msg" class="field-message" aria-live="polite"></small>
          </div>
          <label class="field">
            <span data-i18n="settings.portTimeout"></span>
            <input id="set-port-timeout" type="number" min="100" max="10000" step="1" required />
            <small data-i18n="settings.portTimeoutHint"></small>
          </label>
          <label class="field">
            <span data-i18n="settings.portConcurrency"></span>
            <input id="set-port-concurrency" type="number" min="1" max="1024" step="1" required />
            <small data-i18n="settings.portConcurrencyHint"></small>
          </label>
          <label class="field">
            <span data-i18n="settings.portMaxProbes"></span>
            <input id="set-port-max-probes" type="number" min="1" max="16777216" step="1" required />
            <small data-i18n="settings.portMaxProbesHint"></small>
          </label>
          <label class="checkbox">
            <input id="set-banners" type="checkbox" />
            <span data-i18n="settings.banners"></span>
          </label>
          <small class="muted block" data-i18n="settings.bannersHint"></small>
        </fieldset>
        <fieldset class="field">
          <legend data-i18n="settings.updates"></legend>
          <label class="checkbox">
            <input id="set-check-updates" type="checkbox" />
            <span data-i18n="settings.checkUpdates"></span>
          </label>
          <div class="update-row">
            <button id="set-check-now" type="button" data-i18n="settings.checkNow"></button>
            <span id="set-version" class="muted"></span>
          </div>
          <small id="set-update-status" class="muted" aria-live="polite"></small>
        </fieldset>
        <p id="settings-error" class="error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="settings-cancel" type="button" data-i18n="settings.cancel"></button>
          <button type="submit" class="primary" data-i18n="settings.save"></button>
        </div>
      </form>
    </dialog>
    <dialog id="host-ports-dialog" aria-labelledby="host-ports-title">
      <form id="host-ports-form" method="dialog" novalidate>
        <h2 id="host-ports-title"></h2>
        <label class="field">
          <span data-i18n="hostPorts.ports"></span>
          <select id="host-ports-choice"></select>
        </label>
        <div id="host-ports-custom-field" class="field" hidden>
          <label for="host-ports-custom" data-i18n="settings.portCustom"></label>
          <input
            id="host-ports-custom"
            type="text"
            spellcheck="false"
            autocomplete="off"
            maxlength="2048"
            aria-describedby="host-ports-custom-msg"
            data-i18n-placeholder="settings.portCustomPlaceholder"
          />
          <small id="host-ports-custom-msg" class="field-message" aria-live="polite"></small>
        </div>
        <small class="muted block" data-i18n="hostPorts.hint"></small>
        <div class="dialog-actions">
          <button id="host-ports-cancel" type="button" data-i18n="hostPorts.cancel"></button>
          <button type="submit" class="primary" data-i18n="hostPorts.start"></button>
        </div>
      </form>
    </dialog>

    <dialog id="notice-dialog" aria-labelledby="notice-title" aria-describedby="notice-text">
      <h2 id="notice-title" data-i18n="notice.title"></h2>
      <p id="notice-text" class="notice-text" data-i18n="notice.text"></p>
      <div class="dialog-actions">
        <button id="notice-cancel" type="button" data-i18n="notice.cancel"></button>
        <button id="notice-accept" type="button" class="primary" data-i18n="notice.accept"></button>
      </div>
    </dialog>
  </body>
</html>
