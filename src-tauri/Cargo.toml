[package]
name = "ironsight"
version = "0.1.1"
description = "Ironsight – desktop network scanner (host discovery, device info, export)"
authors = ["MarCel06xX"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MarCel06xX/ironsight"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "ironsight_lib"

[features]
# Portable single-exe build: settings and WebView2 profile next to the executable.
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
