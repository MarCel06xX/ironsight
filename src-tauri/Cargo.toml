[package]
name = "ironsight"
version = "0.1.0"
description = "Ironsight – desktop network scanner (host discovery, device info, export)"
authors = ["MarCel06xX"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MarCel06xX/ironsight"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "ironsight_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
